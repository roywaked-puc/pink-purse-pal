    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Aplica a cor principal da marca antes do primeiro render (evita "piscar" rosa).
      (function () {
        try {
          var hex = localStorage.getItem('marca-cor-primaria');
          if (!hex || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
          var r = parseInt(hex.slice(1, 3), 16) / 255,
            g = parseInt(hex.slice(3, 5), 16) / 255,
            b = parseInt(hex.slice(5, 7), 16) / 255;
          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var l = (max + min) / 2, h = 0, s = 0;
          if (max !== min) {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
          }
          h = Math.round(h); s = Math.round(s * 100); l = Math.round(l * 100);
          var primaria = h + ' ' + s + '% ' + l + '%';
          var fg = l >= 62 ? '340 10% 20%' : '0 0% 100%';
          var st = document.documentElement.style;
          st.setProperty('--primary', primaria);
          st.setProperty('--primary-foreground', fg);
          st.setProperty('--ring', primaria);
          st.setProperty('--secondary', h + ' ' + Math.min(s, 30) + '% 95%');
          st.setProperty('--secondary-foreground', h + ' ' + Math.min(s, 30) + '% 35%');
          st.setProperty('--accent', h + ' ' + Math.min(s, 50) + '% 90%');
          st.setProperty('--accent-foreground', h + ' ' + Math.min(s, 50) + '% 30%');
          st.setProperty('--sidebar-primary', primaria);
          st.setProperty('--sidebar-primary-foreground', fg);
          st.setProperty('--sidebar-accent', h + ' ' + Math.min(s, 30) + '% 95%');
          st.setProperty('--sidebar-accent-foreground', h + ' ' + Math.min(s, 30) + '% 35%');
          st.setProperty('--sidebar-ring', primaria);
        } catch (e) { /* sem tema personalizado */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
